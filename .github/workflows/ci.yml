name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart run tool/check_phase0.dart
      - run: dart run tool/check_dependencies.dart
      - run: flutter analyze --fatal-infos
      - run: flutter test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: apk
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libavahi-client-dev
      - run: flutter pub get
      - if: matrix.target != 'apk'
        run: flutter test test/phase0/drift_spike_test.dart test/phase0/sodium_spike_test.dart
      - run: flutter build ${{ matrix.target }} --release
